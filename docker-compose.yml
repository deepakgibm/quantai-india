version: '3.8'

services:
  backend:
    build: ./backend
    container_name: algobot_backend
    command: gunicorn main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@postgres/algobot
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - UPSTOX_API_KEY=${UPSTOX_API_KEY}
      - UPSTOX_API_SECRET=${UPSTOX_API_SECRET}
      - UPSTOX_REDIRECT_URI=${UPSTOX_REDIRECT_URI}
    depends_on:
      - postgres
      - redis
    networks:
      - algobot_net

  celery_worker:
    build: ./backend
    container_name: algobot_worker
    command: celery -A worker.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@postgres/algobot
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - backend
      - redis
      - postgres
    networks:
      - algobot_net

  celery_beat:
    build: ./backend
    container_name: algobot_beat
    command: celery -A worker.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@postgres/algobot
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - backend
      - redis
      - postgres
    networks:
      - algobot_net

  frontend:
    build: ./frontend
    container_name: algobot_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - algobot_net

  nginx:
    image: nginx:alpine
    container_name: algobot_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - algobot_net

  postgres:
    image: postgres:15
    container_name: algobot_postgres
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=algobot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - algobot_net

  redis:
    image: redis:7
    container_name: algobot_redis
    networks:
      - algobot_net

networks:
  algobot_net:
    driver: bridge

volumes:
  postgres_data:
