# QuantAI India - Docker Compose Configuration
# Full stack: Frontend, Backend API, HP Scanner Worker, Dragonfly Cache, PostgreSQL

version: '3.9'

services:
  # ==========================================================================
  # Dragonfly Cache (Redis-compatible, 25x faster)
  # ==========================================================================
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: quantai-dragonfly
    ports:
      - "6379:6379"
    volumes:
      - dragonfly_data:/data
    command: dragonfly --logtostderr
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Backend API (FastAPI)
  # ==========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quantai-backend
    env_file:
      - ./backend/.env
    environment:
      - DRAGONFLY_HOST=dragonfly
      - DRAGONFLY_PORT=6379
      - UPSTOX_API_KEY=${UPSTOX_API_KEY:-}
      - UPSTOX_API_SECRET=${UPSTOX_API_SECRET:-}
      - UPSTOX_REDIRECT_URI=${UPSTOX_REDIRECT_URI:-}
      - UPSTOX_ACCESS_TOKEN=${UPSTOX_ACCESS_TOKEN:-}
      - SECRET_KEY=${SECRET_KEY:-QuantAI_Dev_SecretKey_2025_Secure_RandomToken_AbCdEfGhIjKlMnOpQrStUvWxYz123456789}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
      - DATABASE_URL=postgresql+asyncpg://postgres:admin@host.docker.internal:5432/quantai

    volumes:
      - ./backend:/app
      - ./data:/data
    command: [ "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    ports:
      - "8000:8000"
    depends_on:
      dragonfly:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================================================
  # HP Scanner Worker (Background processing)
  # ==========================================================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: quantai-worker
    volumes:
      - ./backend:/app
      - ./data:/data
    environment:
      - DRAGONFLY_HOST=dragonfly
      - DRAGONFLY_PORT=6379
      - DATABASE_URL=postgresql+asyncpg://postgres:admin@host.docker.internal:5432/quantai
    depends_on:
      dragonfly:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  # ==========================================================================
  # Frontend (React + Vite + nginx)
  # ==========================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
        - VITE_FIREBASE_MEASUREMENTID=${VITE_FIREBASE_MEASUREMENTID}
    container_name: quantai-frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # Monitoring Stack (Prometheus + Grafana + Exporters)
  # ==========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: quantai-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: quantai-grafana
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter
    container_name: quantai-redis-exporter
    environment:
      - REDIS_ADDR=redis://dragonfly:6379
    ports:
      - "9121:9121"
    depends_on:
      - dragonfly
    restart: unless-stopped
  # Node exporter removed as it is Linux-specific and fails on Windows host.


  # ==========================================================================
  # Volumes
  # ==========================================================================
volumes:
  dragonfly_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ==========================================================================
# Networks (default bridge network is used)
# ==========================================================================
