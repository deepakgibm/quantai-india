# QuantAI India - Docker Compose Configuration
# Full stack: Frontend, Backend API, HP Scanner Worker, Dragonfly Cache, Monitoring

# QuantAI Docker Orchestration

services:
  # ==========================================================================
  # Dragonfly Cache (Redis-compatible, 25x faster)
  # ==========================================================================
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: quantai-dragonfly
    ports:
      - "6379:6379"
    volumes:
      - dragonfly_data:/data
    command: dragonfly --logtostderr --cache_mode=true
    restart: unless-stopped
    mem_limit: 512m
    cpus: '1.0'
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Backend API (FastAPI) — Multi-worker, no --reload
  # ==========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quantai-backend
    env_file:
      - .env
    environment:
      - DRAGONFLY_HOST=dragonfly
      - DRAGONFLY_PORT=6379
      - UPSTOX_API_KEY=${UPSTOX_API_KEY:-}
      - UPSTOX_API_SECRET=${UPSTOX_API_SECRET:-}
      - UPSTOX_REDIRECT_URI=${UPSTOX_REDIRECT_URI:-}
      - UPSTOX_ACCESS_TOKEN=${UPSTOX_ACCESS_TOKEN:-}
      - SECRET_KEY=${SECRET_KEY:-QuantAI_Dev_SecretKey_2025_Secure_RandomToken_AbCdEfGhIjKlMnOpQrStUvWxYz123456789}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
      - DATABASE_URL=postgresql+asyncpg://postgres:admin@host.docker.internal:5432/quantai
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173
      - ENVIRONMENT=production
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-generate_your_own_key_here}
      - CELERY_BROKER_URL=redis://dragonfly:6379/1
      - CELERY_RESULT_BACKEND=redis://dragonfly:6379/2
      - ENABLE_AI_FEATURES=false
      - SAFE_MODE=true
      - MOCK_AI_RESPONSES=true
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python

    volumes:
      - ./backend:/app
      - ./data:/data
    # command: [ "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2" ]
    ports:
      - "8000:8000"
    mem_limit: 2g
    cpus: '2.0'
    depends_on:
      dragonfly:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-s", "http://127.0.0.1:8000/api/health/" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ==========================================================================
  # HP Scanner Worker (Background processing)
  # ==========================================================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: quantai-worker
    volumes:
      - ./backend:/app
      - ./data:/data
    env_file:
      - .env
    environment:
      - DRAGONFLY_HOST=dragonfly
      - DRAGONFLY_PORT=6379
      - CELERY_BROKER_URL=redis://dragonfly:6379/1
      - CELERY_RESULT_BACKEND=redis://dragonfly:6379/2
      - DATABASE_URL=postgresql+asyncpg://postgres:admin@host.docker.internal:5432/quantai
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-generate_your_own_key_here}
      - ENABLE_AI_FEATURES=${ENABLE_AI_FEATURES:-false}
      - SAFE_MODE=${SAFE_MODE:-true}
      - MOCK_AI_RESPONSES=${MOCK_AI_RESPONSES:-true}
    mem_limit: 4g
    cpus: '2.0'
    depends_on:
      dragonfly:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import os; exit(0)" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # Celery Worker (Task Queue — ML Training, Backtesting)
  # ==========================================================================
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: quantai-celery-worker
    volumes:
      - ./backend:/app
      - ./data:/data
    env_file:
      - .env
    environment:
      - DRAGONFLY_HOST=dragonfly
      - DRAGONFLY_PORT=6379
      - DATABASE_URL=postgresql+asyncpg://postgres:admin@host.docker.internal:5432/quantai
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-generate_your_own_key_here}
      - CELERY_BROKER_URL=redis://dragonfly:6379/1
      - CELERY_RESULT_BACKEND=redis://dragonfly:6379/2
      - ENABLE_AI_FEATURES=${ENABLE_AI_FEATURES:-false}
      - SAFE_MODE=${SAFE_MODE:-true}
      - MOCK_AI_RESPONSES=${MOCK_AI_RESPONSES:-true}
    mem_limit: 4g
    cpus: '2.0'
    depends_on:
      dragonfly:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "celery", "-A", "celery_app", "inspect", "ping", "--timeout", "5" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ==========================================================================
  # Market Data Service (Real-time Ingestion & Pub/Sub)
  # ==========================================================================
  market-data-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.market
    container_name: quantai-market-service
    volumes:
      - ./backend:/app
      - ./data:/data
    env_file:
      - .env
    environment:
      - DRAGONFLY_HOST=dragonfly
      - DRAGONFLY_PORT=6379
      - DATABASE_URL=postgresql+asyncpg://postgres:admin@host.docker.internal:5432/quantai
      - ENVIRONMENT=production
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-generate_your_own_key_here}
      - ENABLE_AI_FEATURES=${ENABLE_AI_FEATURES:-false}
      - SAFE_MODE=${SAFE_MODE:-true}
      - MOCK_AI_RESPONSES=${MOCK_AI_RESPONSES:-true}
    ports:
      - "8001:8001"
    mem_limit: 2g
    cpus: '1.0'
    depends_on:
      dragonfly:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # Apache Kafka (KRaft Broker)
  # ==========================================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: quantai-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REREPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list" ]
      interval: 15s
      timeout: 10s
      retries: 5

  # ==========================================================================
  # Market Feed Service (Upstox WS -> Kafka -> Consumers)
  # ==========================================================================
  market-feed-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.market
    container_name: quantai-market-feed
    command: ["python", "services/market_feed_service/main.py"]
    volumes:
      - ./backend:/app
      - ./data:/data
    env_file:
      - .env
    environment:
      - DRAGONFLY_HOST=dragonfly
      - DRAGONFLY_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - DATABASE_URL=postgresql+asyncpg://postgres:admin@host.docker.internal:5432/quantai
      - ENVIRONMENT=production
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-generate_your_own_key_here}
    ports:
      - "8002:8002"
    mem_limit: 2g
    cpus: '1.0'
    depends_on:
      dragonfly:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8002/health" ]
      interval: 15s
      timeout: 5s
      retries: 3

  # ==========================================================================
  # Frontend (React + Vite + nginx)
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
        - VITE_FIREBASE_MEASUREMENTID=${VITE_FIREBASE_MEASUREMENTID}
    container_name: quantai-frontend
    ports:
      - "3000:80"
    mem_limit: 256m
    cpus: '0.5'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # Monitoring Stack (Prometheus + Grafana + Exporters)
  # ==========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: quantai-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    mem_limit: 512m
    cpus: '0.5'
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: quantai-grafana
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    mem_limit: 256m
    cpus: '0.5'
    depends_on:
      - prometheus
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  redis-exporter:
    image: oliver006/redis_exporter:alpine
    container_name: quantai-redis-exporter
    environment:
      - REDIS_ADDR=redis://dragonfly:6379
    ports:
      - "9121:9121"
    mem_limit: 128m
    cpus: '0.25'
    depends_on:
      - dragonfly
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9121/metrics" ]
      interval: 30s
      timeout: 5s
      retries: 3
  # Node exporter removed as it is Linux-specific and fails on Windows host.

  # ==========================================================================
  # Volumes
  # ==========================================================================
volumes:
  dragonfly_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ==========================================================================
# Networks (default bridge network is used)
# ==========================================================================
