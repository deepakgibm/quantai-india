replicaCount: 3

image:
  backend:
    repository: quantai-backend
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: quantai-frontend
    tag: latest
    pullPolicy: IfNotPresent
  worker:
    repository: quantai-worker
    tag: latest
    pullPolicy: IfNotPresent
  celery:
    repository: quantai-celery-worker
    tag: latest
    pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: quantai.internal
      paths:
        - path: /
          pathType: ImplementationSpecific

resources:
  backend:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
  worker:
    limits:
      cpu: 4000m
      memory: 8Gi
    requests:
      cpu: 1000m
      memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

env:
  ENVIRONMENT: production
  PGBOUNCER_ENABLED: "true"
  DRAGONFLY_USE_CLUSTER: "true"
  DATABASE_URL: "postgresql+asyncpg://postgres:admin@pgbouncer:6432/quantai_primary"
  READ_DATABASE_URL: "postgresql+asyncpg://postgres:admin@pgbouncer:6432/quantai_replica"
