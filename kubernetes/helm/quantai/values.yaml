replicaCount: 3

image:
  backend:
    repository: quantai-backend
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: quantai-frontend
    tag: latest
    pullPolicy: IfNotPresent
  worker:
    repository: quantai-worker
    tag: latest
    pullPolicy: IfNotPresent
  celery:
    repository: quantai-celery-worker
    tag: latest
    pullPolicy: IfNotPresent
  marketFeed:
    repository: quantai-market-feed
    tag: latest
    pullPolicy: IfNotPresent
  marketData:
    repository: quantai-market-data
    tag: latest
    pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: quantai.internal
      paths:
        - path: /api
          pathType: Prefix
          serviceName: backend
          servicePort: 8000
        - path: /
          pathType: Prefix
          serviceName: frontend
          servicePort: 80

resources:
  backend:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
  worker:
    limits:
      cpu: 4000m
      memory: 8Gi
    requests:
      cpu: 1000m
      memory: 2Gi

autoscaling:
  backend:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  frontend:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

database:
  host: postgres-service  # DNS name for external primary RDS/CloudSQL
  port: 5432
  user: postgres
  password: admin
  name: quantai
  poolMode: transaction
  maxClientConn: 1000
  defaultPoolSize: 30
  url: "postgresql+asyncpg://postgres:admin@quantai-pgbouncer:6432/quantai"
  readUrl: "postgresql+asyncpg://postgres:admin@quantai-pgbouncer:6432/quantai"

secrets:
  upstoxApiKey: "placeholder_key"
  upstoxApiSecret: "placeholder_secret"
  upstoxAccessToken: "placeholder_token"
  tokenEncryptionKey: "generate_your_own_key_here"
  jwtSecret: "supersecretkey"
  geminiApiKey: "placeholder_gemini_key"

env:
  ENVIRONMENT: production
  PGBOUNCER_ENABLED: "true"
  DRAGONFLY_USE_CLUSTER: "true"


