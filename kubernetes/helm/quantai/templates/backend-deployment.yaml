apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quantai.fullname" . }}-backend
  labels:
    {{- include "quantai.labels" . | nindent 4 }}
    component: backend
spec:
  {{- if not .Values.autoscaling.backend.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quantai.selectorLabels" . | nindent 6 }}
      component: backend
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "quantai.selectorLabels" . | nindent 8 }}
        component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "quantai.fullname" . }}-secrets
                  key: database-url
            - name: READ_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "quantai.fullname" . }}-secrets
                  key: read-database-url
            - name: UPSTOX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "quantai.fullname" . }}-secrets
                  key: upstox-api-key
            - name: UPSTOX_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "quantai.fullname" . }}-secrets
                  key: upstox-api-secret
            - name: UPSTOX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "quantai.fullname" . }}-secrets
                  key: upstox-access-token
            - name: TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "quantai.fullname" . }}-secrets
                  key: token-encryption-key
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "quantai.fullname" . }}-secrets
                  key: jwt-secret
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "quantai.fullname" . }}-secrets
                  key: gemini-api-key
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health/
              port: http
          readinessProbe:
            httpGet:
              path: /api/health/
              port: http
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
