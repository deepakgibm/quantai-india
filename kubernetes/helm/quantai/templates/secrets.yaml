apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quantai.fullname" . }}-secrets
  labels:
    {{- include "quantai.labels" . | nindent 4 }}
type: Opaque
data:
  database-url: {{ .Values.database.url | b64enc | quote }}
  read-database-url: {{ .Values.database.readUrl | b64enc | quote }}
  upstox-api-key: {{ .Values.secrets.upstoxApiKey | b64enc | quote }}
  upstox-api-secret: {{ .Values.secrets.upstoxApiSecret | b64enc | quote }}
  upstox-access-token: {{ .Values.secrets.upstoxAccessToken | b64enc | quote }}
  token-encryption-key: {{ .Values.secrets.tokenEncryptionKey | b64enc | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  gemini-api-key: {{ .Values.secrets.geminiApiKey | b64enc | quote }}
