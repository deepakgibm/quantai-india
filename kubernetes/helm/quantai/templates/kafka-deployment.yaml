apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quantai.fullname" . }}-kafka
  labels:
    {{- include "quantai.labels" . | nindent 4 }}
    component: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "quantai.selectorLabels" . | nindent 6 }}
      component: kafka
  template:
    metadata:
      labels:
        {{- include "quantai.selectorLabels" . | nindent 8 }}
        component: kafka
    spec:
      containers:
        - name: kafka
          image: "confluentinc/cp-kafka:7.5.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: plaintext
              containerPort: 9092
              protocol: TCP
            - name: internal
              containerPort: 29092
              protocol: TCP
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://{{ include "quantai.fullname" . }}-kafka:29092,PLAINTEXT_HOST://localhost:9092"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REREPLICATION_FACTOR
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@{{ include "quantai.fullname" . }}-kafka:29093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LOG_DIRS
              value: "/tmp/kraft-combined-logs"
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
          livenessProbe:
            tcpSocket:
              port: internal
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: internal
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            limits:
              cpu: 1000m
              memory: 1.5Gi
            requests:
              cpu: 250m
              memory: 512Mi
