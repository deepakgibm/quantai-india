apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quantai.fullname" . }}-market-feed
  labels:
    {{- include "quantai.labels" . | nindent 4 }}
    component: market-feed
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "quantai.selectorLabels" . | nindent 6 }}
      component: market-feed
  template:
    metadata:
      labels:
        {{- include "quantai.selectorLabels" . | nindent 8 }}
        component: market-feed
    spec:
      containers:
        - name: market-feed
          image: "{{ .Values.image.marketFeed.repository }}:{{ .Values.image.marketFeed.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.marketFeed.pullPolicy }}
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
          env:
            - name: DRAGONFLY_HOST
              value: "{{ include "quantai.fullname" . }}-dragonfly"
            - name: DRAGONFLY_PORT
              value: "6379"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "{{ include "quantai.fullname" . }}-kafka:29092"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "quantai.fullname" . }}-secrets
                  key: database-url
            - name: READ_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "quantai.fullname" . }}-secrets
                  key: read-database-url
            - name: UPSTOX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "quantai.fullname" . }}-secrets
                  key: upstox-api-key
            - name: UPSTOX_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "quantai.fullname" . }}-secrets
                  key: upstox-api-secret
            - name: UPSTOX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "quantai.fullname" . }}-secrets
                  key: upstox-access-token
            - name: TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "quantai.fullname" . }}-secrets
                  key: token-encryption-key
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "quantai.fullname" . }}-secrets
                  key: jwt-secret
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "quantai.fullname" . }}-secrets
                  key: gemini-api-key
            {{- range $key, $value := .Values.env }}
            {{- if and (ne $key "DRAGONFLY_HOST") (ne $key "DRAGONFLY_PORT") (ne $key "KAFKA_BOOTSTRAP_SERVERS") (ne $key "DATABASE_URL") (ne $key "READ_DATABASE_URL") (ne $key "UPSTOX_API_KEY") (ne $key "UPSTOX_API_SECRET") (ne $key "UPSTOX_ACCESS_TOKEN") (ne $key "TOKEN_ENCRYPTION_KEY") (ne $key "JWT_SECRET") (ne $key "GEMINI_API_KEY") }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 256Mi
