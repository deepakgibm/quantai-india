apiVersion: v1
kind: Service
metadata:
  name: {{ include "quantai.fullname" . }}-market-data
  labels:
    {{- include "quantai.labels" . | nindent 4 }}
    component: market-data
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8001
      targetPort: 8001
      protocol: TCP
  selector:
    {{- include "quantai.selectorLabels" . | nindent 4 }}
    component: market-data
