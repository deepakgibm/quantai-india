# QuantAI Production Docker Compose
# Complete stack with PostgreSQL, Redis, and monitoring

version: '3.8'

services:
  # ==================
  # Backend API
  # ==================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quantai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.prod.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - quantai-network
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models

  # ==================
  # Frontend
  # ==================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
        - VITE_FIREBASE_MEASUREMENTID=${VITE_FIREBASE_MEASUREMENTID}
    container_name: quantai-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - quantai-network


  # ==================
  # Redis Cache
  # ==================
  redis:
    image: redis:7-alpine
    container_name: quantai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quantai-network
    command: redis-server --appendonly yes

  # ==================
  # Celery Worker (Background Tasks)
  # ==================
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quantai-celery-worker
    restart: unless-stopped
    env_file:
      - .env.prod.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    networks:
      - quantai-network
    command: celery -A celery_app worker --loglevel=info

  # ==================
  # Celery Beat (Scheduled Tasks)
  # ==================
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quantai-celery-beat
    restart: unless-stopped
    env_file:
      - .env.prod.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - celery-worker
    networks:
      - quantai-network
    command: celery -A celery_app beat --loglevel=info

  # ==================
  # Nginx Reverse Proxy
  # ==================
  nginx:
    image: nginx:alpine
    container_name: quantai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - quantai-network

# ==================
# Volumes
# ==================
volumes:
  redis_data:
    driver: local

# ==================
# Networks
# ==================
networks:
  quantai-network:
    driver: bridge
