[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
reserve_pool_size = 5
reserve_linger = 30
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

[databases]
quantai_primary = host=quantai-db port=5432 dbname=quantai
quantai_replica = host=quantai-db-replica port=5432 dbname=quantai
